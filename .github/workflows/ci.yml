name: Security Threat Feed & Streak Keeper

on:
  schedule:
    # Runs at 17:30 UTC (11:00 PM IST) every evening
    - cron: '30 17 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  check-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check user activity today
        id: check_activity
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "Checking GitHub push events for date: $TODAY"
          
          # Query user events via GitHub API
          PUSH_COUNT=$(gh api users/${{ github.repository_owner }}/events | jq --arg date "$TODAY" '
            [.[] | select(.type=="PushEvent" and (.created_at | startswith($date)))] | length
          ')
          
          echo "Total Push Events found today: $PUSH_COUNT"
          
          # Allow override if triggered manually via workflow_dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger detected! Forcing execution regardless of daily activity."
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [ "$PUSH_COUNT" -gt 0 ]; then
            echo "You have already made commits today! Skipping automated commits."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "No commits found today. Proceeding with daily automated streak commits."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Execute 5 Automated Security Feed Commits
        if: steps.check_activity.outputs.skip == 'false'
        run: |
          git config --global user.name "Mohit Kumar"
          git config --global user.email "mohitdevx@gmail.com"
          
          mkdir -p data
          
          declare -a MESSAGES=(
            "chore(feed): sync latest API and web security advisories [cycle 1/5] [skip ci]"
            "chore(intel): update threat intelligence database snapshot [cycle 2/5] [skip ci]"
            "chore(cve): refresh vulnerability catalog definitions [cycle 3/5] [skip ci]"
            "chore(audit): verify integrity of security feed signatures [cycle 4/5] [skip ci]"
            "chore(telemetry): publish daily automated threat feed snapshot [cycle 5/5] [skip ci]"
          )
          
          for i in "${!MESSAGES[@]}"; do
            CYCLE=$((i + 1))
            echo "Executing sync cycle $CYCLE/5..."
            
            # Run the threat intelligence fetcher
            python scripts/fetch_intel.py
            
            # Append unique cycle audit timestamp
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            echo "[$TIMESTAMP] Audit verification completed for cycle #$CYCLE" >> data/sync-audit.log
            
            git add data/
            git commit -m "${MESSAGES[$i]}"
            
            # Brief delay between commits
            sleep 4
          done
          
          echo "Pushing 5 commits to origin..."
          git push origin main
